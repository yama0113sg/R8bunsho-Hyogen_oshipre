<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>推しプレゼン 先生用</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#222;--sub:#666;--edge:#ddd;--acc:#c2185b;--ok:#2e7d32}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121018;--card:#1d1a26;--ink:#eee;--sub:#aaa;--edge:#333;--acc:#ff8ab8;--ok:#7be08a}}
:root[data-theme="dark"]{--bg:#121018;--card:#1d1a26;--ink:#eee;--sub:#aaa;--edge:#333;--acc:#ff8ab8;--ok:#7be08a}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer;border:1px solid var(--edge);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
button.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.cp{font-size:12px;padding:2px 8px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.who{font-weight:700}
.meta{font-size:12px;color:var(--sub)}
.q{border-top:1px dashed var(--edge);padding-top:8px;margin-top:8px}
.type{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:0 8px;margin-right:6px}
.line{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin:4px 0}
.line span{flex:1;white-space:pre-wrap}
ol{margin:4px 0;padding-left:1.4em}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--edge);padding:6px;text-align:left;vertical-align:top}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--sub)}
@media (max-width:600px){table,thead,tbody,tr,th,td{display:block}thead{display:none}td{border:none;padding:2px 0}tr{border-bottom:1px solid var(--edge);padding:6px 0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>推しプレゼン 先生用</h1>
  <p class="lead">生徒が提出した「1年生への質問」と「テーマ」を見て、Classi のアンケートに写すためのページです。生徒が出し直すと、上書きされます。「生徒の一覧」では、じゅもんと進み具合が見られます。</p>

  <div class="card">
    <div class="row">
      <input type="password" id="tpass" placeholder="先生用の合言葉" aria-label="先生用の合言葉" autocomplete="off">
      <button class="main" id="load" type="button">読みこむ</button>
      <span class="meta" id="stat"></span>
    </div>
  </div>

  <div class="tabs" id="tabs" hidden>
    <button type="button" data-v="q" class="on">1年生への質問</button>
    <button type="button" data-v="theme">テーマ</button>
    <button type="button" data-v="st">生徒の一覧（じゅもん・進み具合）</button>
  </div>
  <div id="out"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API="https://kishou.ryousukey0113.workers.dev";
const ss={get(k){try{return sessionStorage.getItem(k)||"";}catch(e){return "";}},set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYPE={single:"単一選択形式",multi:"複数選択形式",text:"記述形式"};
const $=id=>document.getElementById(id);
let items=[], students=[], view="q";
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);};
async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(_){} t.remove(); }
  toast("コピーしました");
}
const byWho=(a,b)=>((a.who&&a.who.cls)||"~").localeCompare((b.who&&b.who.cls)||"~","ja",{numeric:true})||(+(a.who&&a.who.no)||999)-(+(b.who&&b.who.no)||999)||(a.created||0)-(b.created||0);
// 名前は集めない方針（送られてきたときだけ出す）
const whoText=(w,i)=>(w&&w.name)?`${w.cls||""} ${w.no?w.no+"番 ":""}${w.name}`.trim():`提出 ${i+1}`;
const when=ms=>{const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;};
let clips=[];
// 表（Excel・Classi 用）：コピーはタブ区切り（Excel にそのまま表で貼れる）、ダウンロードは CSV（BOM つきで Excel の文字化けを防ぐ）
const cell=v=>String(v??"").replace(/[\t\r\n]+/g," ").trim();
const tsv=rows=>rows.map(r=>r.map(cell).join("\t")).join("\n");
const csv=rows=>"\uFEFF"+rows.map(r=>r.map(v=>{ const c=cell(v); return /[",]/.test(c)?`"${c.replace(/"/g,'""')}"`:c; }).join(",")).join("\r\n");
let dls=[];
const dl=(name,rows)=>{ dls.push([name,rows]); return `<button type="button" class="cp" data-dl="${dls.length-1}">CSV</button>`; };
function download(name,text){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
const ymdNow=()=>{ const d=new Date(); return `${d.getMonth()+1}${String(d.getDate()).padStart(2,"0")}`; };
const W=w=>[w&&w.cls||"",w&&w.no||"",w&&w.name||""];
const cp=text=>{ clips.push(text); return `<button type="button" class="cp" data-cp="${clips.length-1}">コピー</button>`; };
function render(){
  clips=[]; dls=[];
  if(view==="st") return renderStudents();
  const list=items.filter(x=>x.kind===view).sort(byWho);
  let h="";
  // まだ出していない生徒（はじめに名前を入れた生徒のうち、この提出がない人）
  const done=new Set(list.map(x=>x.token)), notyet=students.filter(x=>!done.has(x.owner)).sort(byWho);
  if(students.length) h+=`<div class="card"><b>まだ出していない：${notyet.length}人</b>${notyet.length?`<div class="meta">${notyet.map(x=>esc(whoText(x.who,0))).join("　")}</div>`:""}<div class="meta">（ページを開いて名前を入れた生徒の中から。まだ一度も開いていない生徒は、ここに出ません）</div></div>`;
  if(!list.length) h+=`<p class="empty">まだ提出はありません。</p>`;
  else if(view==="q"){
    const all=list.map((x,i)=>`【${whoText(x.who,i)}】\n`+x.data.qs.map((q,i)=>`質問${i+1}（${TYPE[q.type]}）${q.text}`+(q.type!=="text"?"\n"+q.opts.map(o=>"・"+o).join("\n"):"")).join("\n")).join("\n\n");
    const maxOpt=Math.max(2,...list.flatMap(x=>x.data.qs.map(q=>q.type==="text"?0:q.opts.length)));
    const qrows=[["組","番","名前","質問","形式","設問文",...Array.from({length:maxOpt},(_,i)=>`選択肢${i+1}`),"使い方"],
      ...list.flatMap(x=>x.data.qs.map((q,i)=>[...W(x.who),i+1,TYPE[q.type],q.text,...Array.from({length:maxOpt},(_,k)=>q.type==="text"?"":(q.opts[k]||"")),q.use||""]))];
    h+=`<div class="card"><div class="row"><span>${list.length}人が提出</span>${cp(tsv(qrows))}<span class="meta">表としてコピー（Excel に貼ると、組・番・名前・質問…の列に分かれます）</span>${dl(`oshipre_questions_${ymdNow()}.csv`,qrows)}<span class="meta">ダウンロード</span></div>`+
      `<div class="row" style="margin-top:6px">${cp(all)}<span class="meta">文字でまとめてコピー（前のかたち）</span></div></div>`;
    list.forEach((x,xi)=>{
      h+=`<div class="card"><div class="who">${esc(whoText(x.who,xi))} <span class="meta">（${when(x.updated)}）</span></div>`;
      x.data.qs.forEach((q,i)=>{
        h+=`<div class="q"><div><span class="type">${TYPE[q.type]}</span>質問${i+1}</div>`+
          `<div class="line"><span>${esc(q.text)}</span>${cp(q.text)}</div>`;
        if(q.type!=="text"){
          h+=`<ol>`+q.opts.map(o=>`<li><div class="line"><span>${esc(o)}</span>${cp(o)}</div></li>`).join("")+`</ol>`+
            `<div class="row"><span class="meta">選択肢をまとめて</span>${cp(q.opts.join("\n"))}</div>`;
        }
        if(q.use) h+=`<div class="meta">使い方：${esc(q.use)}</div>`;
        h+=`</div>`;
      });
      h+=`</div>`;
    });
  }else{
    const titles=list.map(x=>x.data.fttl).join("\n");
    const withIntro=list.map(x=>`${x.data.fttl}${x.data.intro?"："+x.data.intro:""}`).join("\n");
    const trows=[["組","番","名前","タイトル","テーマ","ひとこと紹介","1年生にどうなってほしいか"],...list.map(x=>[...W(x.who),x.data.fttl,x.data.fin,x.data.intro,x.data.who])];
    h+=`<div class="card"><div class="row"><span>${list.length}人が提出</span>${cp(tsv(trows))}<span class="meta">表としてコピー（Excel 用）</span>${dl(`oshipre_themes_${ymdNow()}.csv`,trows)}<span class="meta">ダウンロード</span></div>`+
      `<div class="row" style="margin-top:6px">${cp(titles)}<span class="meta">タイトル一覧</span>${cp(withIntro)}<span class="meta">ひとこと紹介つき（1年生の視聴アンケートの選択肢に）</span></div></div>`;
    h+=`<div class="card"><table><thead><tr><th>提出</th><th>タイトル</th><th>テーマ</th><th>ひとこと紹介</th><th>1年生にどうなってほしいか</th></tr></thead><tbody>`+
      list.map((x,i)=>`<tr><td>${esc(whoText(x.who,i))}<div class="meta">${when(x.updated)}</div></td><td>${esc(x.data.fttl)}</td><td>${esc(x.data.fin)}</td><td>${esc(x.data.intro)}</td><td>${esc(x.data.who)}</td></tr>`).join("")+`</tbody></table></div>`;
  }
  $("out").innerHTML=h;
  $("out").querySelectorAll("[data-cp]").forEach(b=>b.addEventListener("click",()=>copy(clips[+b.dataset.cp])));
  $("out").querySelectorAll("[data-dl]").forEach(b=>b.addEventListener("click",()=>{ const [n,rows]=dls[+b.dataset.dl]; download(n,csv(rows)); }));
}
function renderStudents(){
  clips=[]; dls=[];
  const L=students.slice().sort(byWho), sub=k=>new Set(items.filter(x=>x.kind===k).map(x=>x.token));
  const sq=sub("q"), sth=sub("theme"), ok=b=>b?"✔":"—";
  const srows=[["組","番","名前","じゅもん","推し","タイトル","質問の提出","テーマの提出","構成","絵コンテ","スライドのチェック","練習","最後に預けた"],
    ...L.map(x=>[...W(x.who),x.code,x.oshi,x.fttl,sq.has(x.owner)?"済":"",sth.has(x.owner)?"済":"",`${x.st}/5`,`${x.sb}枚`,`${x.ck}/9`,`${x.pt}回`,when(x.savedAt)])];
  let h=`<div class="card"><div class="row"><span>${L.length}人</span>${cp(tsv(srows))}<span class="meta">表としてコピー</span>${dl(`oshipre_students_${ymdNow()}.csv`,srows)}<span class="meta">ダウンロード</span></div><div class="meta">じゅもんを忘れた生徒には、ここのじゅもんを教えてください（別の端末で「じゅもんで呼び出す」に入れると、続きが開けます）。</div></div>`;
  h+=`<div class="card"><table><thead><tr><th>生徒</th><th>じゅもん</th><th>推し／タイトル</th><th>質問</th><th>テーマ</th><th>構成</th><th>絵コンテ</th><th>スライド</th><th>練習</th></tr></thead><tbody>`+
    L.map(x=>`<tr><td>${esc(whoText(x.who,0))}<div class="meta">${when(x.savedAt)} に預けた</div></td><td>${esc(x.code)} ${cp(x.code)}</td><td>${esc(x.oshi)}${x.fttl?`<div class="meta">${esc(x.fttl)}</div>`:""}</td>`+
      `<td>${ok(sq.has(x.owner))}</td><td>${ok(sth.has(x.owner))}</td><td>${x.st}/5</td><td>${x.sb}枚</td><td>${x.ck}/9</td><td>${x.pt}回</td></tr>`).join("")+`</tbody></table></div>`;
  $("out").innerHTML=h;
  $("out").querySelectorAll("[data-cp]").forEach(b=>b.addEventListener("click",()=>copy(clips[+b.dataset.cp])));
  $("out").querySelectorAll("[data-dl]").forEach(b=>b.addEventListener("click",()=>{ const [n,rows]=dls[+b.dataset.dl]; download(n,csv(rows)); }));
}
async function load(){
  const pass=$("tpass").value.trim()||ss.get("bunko_tpass");
  if(!pass){ $("stat").textContent="合言葉を入れてください"; return; }
  $("stat").textContent="読みこみ中…";
  try{
    const r=await fetch(API,{method:"POST",headers:{"X-Op":"list","Content-Type":"application/json","X-Teacher":encodeURIComponent(pass)},body:"{}"});
    const j=await r.json().catch(()=>({}));
    if(r.status===401||r.status===403){ $("stat").textContent="合言葉がちがうようです"; return; }
    if(!r.ok) throw new Error(j.message||j.error||"読みこめませんでした");
    ss.set("bunko_tpass",pass); items=j.items||[];
    try{ const r2=await fetch(API,{method:"POST",headers:{"X-Op":"spells","Content-Type":"application/json","X-Teacher":encodeURIComponent(pass)},body:"{}"});
      const j2=await r2.json().catch(()=>({})); students=r2.ok?(j2.items||[]):[]; }catch(e){ students=[]; }
    $("stat").textContent=`読みこみました（${when(Date.now())}）`; $("tabs").hidden=false; render();
  }catch(e){ $("stat").textContent=e.message; }
}
$("load").addEventListener("click",load);
$("tpass").addEventListener("keydown",e=>{ if(e.key==="Enter") load(); });
$("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ view=b.dataset.v; $("tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); render(); }));
if(ss.get("bunko_tpass")) load();
</script>
</body>
</html>
